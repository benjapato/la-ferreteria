<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | La Ferretería</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 20px;
            background: #f1f3f5;
            color: #222;
            font-family: Arial, sans-serif;
        }

        .tarjeta-login {
            width: 100%;
            max-width: 430px;
            padding: 32px;
            border-radius: 12px;
            background-color: white;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
        }

        .marca {
            margin-bottom: 28px;
            text-align: center;
        }

        .marca h1 {
            margin: 0;
            font-size: 28px;
        }

        .marca p {
            margin: 8px 0 0;
            color: #666;
        }

        .campo {
            margin-top: 17px;
        }

        .campo label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .campo input {
            width: 100%;
            height: 44px;
            padding: 0 12px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 15px;
        }

        .campo input:focus {
            border-color: #2563eb;
            outline: 2px solid rgba(37, 99, 235, 0.14);
        }

        .boton-ingresar {
            width: 100%;
            height: 44px;
            margin-top: 23px;
            border: none;
            border-radius: 6px;
            background-color: #222;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .boton-ingresar:hover {
            background-color: #444;
        }

        .mensaje,
        .error {
            margin-bottom: 17px;
            padding: 11px 13px;
            border-radius: 6px;
            font-size: 14px;
        }

        .mensaje {
            background-color: #d1e7dd;
            color: #0f5132;
        }

        .error {
            background-color: #f8d7da;
            color: #842029;
        }

        .ayuda {
            margin-top: 20px;
            color: #777;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>

<body>

<main class="tarjeta-login">

    <div class="marca">
        <h1>La Ferretería</h1>

        <p>
            Ingresá con tu usuario para continuar.
        </p>
    </div>

    <div th:if="${param.error}"
         class="error">
        Usuario, contraseña o estado incorrecto.
    </div>

    <div th:if="${param.logout}"
         class="mensaje">
        La sesión se cerró correctamente.
    </div>

    <form th:action="@{/login}"
          method="post">

        <div class="campo">
            <label for="nombreUsuario">
                Usuario
            </label>

            <input id="nombreUsuario"
                   type="text"
                   name="nombreUsuario"
                   autocomplete="username"
                   autofocus
                   required>
        </div>

        <div class="campo">
            <label for="contrasena">
                Contraseña
            </label>

            <input id="contrasena"
                   type="password"
                   name="contrasena"
                   autocomplete="current-password"
                   required>
        </div>

        <button type="submit"
                class="boton-ingresar">
            Iniciar sesión
        </button>

    </form>

    <div class="ayuda">
        El administrador puede crear y desactivar usuarios
        desde la opción Usuarios.
    </div>

</main>

</body>
</html>
