<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Categorías | La Ferretería</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 40px;
        }

        .contenedor {
            max-width: 900px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            margin-top: 0;
        }

        .encabezado {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .acciones-encabezado {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .boton-nuevo,
        .boton-inicio {
            display: inline-block;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 5px;
        }

        .boton-nuevo {
            background-color: #333;
            color: white;
        }

        .boton-nuevo:hover {
            background-color: #555;
        }

        .boton-inicio {
            background-color: #ddd;
            color: #333;
        }

        .boton-inicio:hover {
            background-color: #c8c8c8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #333;
            color: white;
        }

        tbody tr:hover {
            background-color: #f5f5f5;
        }

        .activa {
            color: green;
            font-weight: bold;
        }

        .inactiva {
            color: red;
            font-weight: bold;
        }

        .boton-editar {
            display: inline-block;
            padding: 7px 12px;
            background-color: #e0e0e0;
            color: #333;
            text-decoration: none;
            border-radius: 5px;
        }

        .boton-editar:hover {
            background-color: #c8c8c8;
        }

        .sin-datos {
            padding: 20px;
            text-align: center;
            color: #666;
        }
        .acciones {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .acciones form {
            margin: 0;
        }

        .boton-desactivar,
        .boton-activar {
            padding: 7px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .boton-desactivar {
            background-color: #f3c5c5;
            color: #8b0000;
        }

        .boton-desactivar:hover {
            background-color: #e9aaaa;
        }

        .boton-activar {
            background-color: #c8e6c9;
            color: #176b1b;
        }

        .boton-activar:hover {
            background-color: #a8d8aa;
        }
    </style>
    <th:block th:replace="~{fragments/navegacion :: estilos}"></th:block>
</head>

<body class="app-con-navegacion">
<div th:replace="~{fragments/navegacion :: estructura}"></div>

<div class="contenedor">

    <div class="encabezado">

        <div>
            <h1>Categorías</h1>
            <p>Categorías de productos de la ferretería.</p>
        </div>

        <div class="acciones-encabezado">
            <a class="boton-inicio"
               th:href="@{/}">
                Inicio
            </a>

            <a class="boton-nuevo"
               th:href="@{/categorias/nueva}">
                Nueva categoría
            </a>
        </div>

    </div>

    <table>

        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="categoria : ${categorias}">

            <td th:text="${categoria.id}"></td>

            <td th:text="${categoria.nombre}"></td>

            <td th:text="${categoria.descripcion}"></td>

            <td>
                <span th:if="${categoria.activa}"
                      class="activa">
                    Activa
                </span>

                <span th:unless="${categoria.activa}"
                      class="inactiva">
                    Inactiva
                </span>
            </td>

            <td class="acciones">

                <a class="boton-editar"
                   th:href="@{/categorias/editar/{id}(id=${categoria.id})}">
                    Editar
                </a>

                <form th:action="@{/categorias/cambiar-estado/{id}(id=${categoria.id})}"
                      method="post">

                    <button type="submit"
                            th:class="${categoria.activa}
                    ? 'boton-desactivar'
                    : 'boton-activar'"
                            th:text="${categoria.activa}
                    ? 'Desactivar'
                    : 'Activar'">
                    </button>

                </form>

            </td>

        </tr>

        <tr th:if="${#lists.isEmpty(categorias)}">

            <td colspan="5"
                class="sin-datos">
                Todavía no hay categorías registradas.
            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
