<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
  <title>Ajuste de stock | La Ferretería</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }

    .contenedor {
      max-width: 750px;
      margin: auto;
      padding: 30px;
      background-color: white;
      border-radius: 10px;
    }

    h1 {
      margin-top: 0;
    }

    .aviso {
      margin: 20px 0;
      padding: 15px;
      border-radius: 6px;
      background-color: #fff3cd;
      color: #664d03;
    }

    .error {
      margin: 20px 0;
      padding: 13px;
      border-radius: 6px;
      background-color: #f8d7da;
      color: #842029;
    }

    .campo {
      margin-top: 20px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    select,
    input,
    textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #bbb;
      border-radius: 5px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .aclaracion {
      margin-top: 6px;
      color: #666;
      font-size: 13px;
    }

    .acciones {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 28px;
    }

    .boton {
      display: inline-block;
      padding: 11px 18px;
      border: none;
      border-radius: 5px;
      text-decoration: none;
      cursor: pointer;
      font-size: 15px;
    }

    .guardar {
      background-color: #333;
      color: white;
    }

    .volver {
      background-color: #ddd;
      color: #333;
    }

    @media (max-width: 600px) {
      body {
        padding: 15px;
      }

      .contenedor {
        padding: 20px;
      }
    }
  </style>
  <th:block th:replace="~{fragments/navegacion :: estilos}"></th:block>
</head>

<body class="app-con-navegacion">
<div th:replace="~{fragments/navegacion :: estructura}"></div>

<div class="contenedor">

  <h1>Ajuste manual de stock</h1>

  <p>
    Utilizá esta opción para corregir diferencias de inventario,
    pérdidas, roturas o mercadería encontrada.
  </p>

  <div class="aviso">
    Los ajustes quedarán registrados permanentemente en el
    historial de movimientos de stock.
  </div>

  <div th:if="${error}"
       class="error"
       th:text="${error}">
  </div>

  <form th:action="@{/movimientos-stock/ajuste}"
        method="post">

    <div class="campo">

      <label for="productoId">
        Producto
      </label>

      <select id="productoId"
              name="productoId"
              required>

        <option value="">
          Seleccione un producto
        </option>

        <option th:each="producto : ${productos}"
                th:value="${producto.id}"
                th:text="${producto.codigo
                            + ' - '
                            + producto.nombre
                            + ' | Stock: '
                            + producto.stockActual
                                .stripTrailingZeros()
                                .toPlainString()}">
        </option>

      </select>

    </div>

    <div class="campo">

      <label for="tipo">
        Tipo de ajuste
      </label>

      <select id="tipo"
              name="tipo"
              required>

        <option value="">
          Seleccione el tipo
        </option>

        <option value="AJUSTE_ENTRADA">
          Entrada: aumentar stock
        </option>

        <option value="AJUSTE_SALIDA">
          Salida: disminuir stock
        </option>

      </select>

      <div class="aclaracion">
        La salida no podrá dejar el stock en un valor negativo.
      </div>

    </div>

    <div class="campo">

      <label for="cantidad">
        Cantidad
      </label>

      <input id="cantidad"
             name="cantidad"
             type="number"
             min="0.001"
             step="0.001"
             placeholder="Ejemplo: 5"
             required>

    </div>

    <div class="campo">

      <label for="observacion">
        Motivo u observación
      </label>

      <textarea id="observacion"
                name="observacion"
                maxlength="300"
                placeholder="Ejemplo: Se retiraron productos dañados">
            </textarea>

    </div>

    <div class="acciones">
      <a class="boton volver"
         th:href="@{/}">
        Inicio
      </a>

      <button type="submit"
              class="boton guardar"
              onclick="return confirm('¿Registrar este ajuste de stock?')">
        Registrar ajuste
      </button>

      <a class="boton volver"
         th:href="@{/movimientos-stock}">
        Volver
      </a>

    </div>

  </form>

</div>

</body>
</html>
