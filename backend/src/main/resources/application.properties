spring.application.name=LaFerreteriaReactBackend
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/laferreteria_demo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

server.port=${SERVER_PORT:9092}
server.servlet.session.cookie.name=LAFERRETERIA_REACT_SESSION
server.servlet.session.cookie.same-site=lax

app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW:true}

# Credenciales elegidas por quien instala la demo; no se incluyen valores por defecto.
app.usuario-inicial.nombre=${APP_USUARIO_INICIAL_NOMBRE}
app.usuario-inicial.usuario=${APP_USUARIO_INICIAL_USUARIO}
app.usuario-inicial.contrasena=${APP_USUARIO_INICIAL_CONTRASENA}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Los backups de una demo deben quedar fuera del repositorio.
app.copias-seguridad.directorio=${APP_COPIAS_SEGURIDAD_DIRECTORIO:backups-demo}
app.copias-seguridad.pg-dump=${APP_COPIAS_SEGURIDAD_PG_DUMP:pg_dump}
app.copias-seguridad.automaticas.habilitadas=${APP_COPIAS_SEGURIDAD_AUTOMATICAS:false}
app.copias-seguridad.automaticas.cron=${APP_COPIAS_SEGURIDAD_CRON:0 0 18 * * *}
app.copias-seguridad.automaticas.zona=${APP_COPIAS_SEGURIDAD_ZONA:America/Argentina/Buenos_Aires}

# Cierre diario de caja.
app.caja.cierre-automatico.habilitado=${APP_CAJA_CIERRE_AUTOMATICO:true}
app.caja.cierre-automatico.hora=${APP_CAJA_HORA_CIERRE:23:00}
app.caja.cierre-automatico.hora-aviso=${APP_CAJA_HORA_AVISO:22:45}
app.caja.cierre-automatico.verificacion-cron=${APP_CAJA_VERIFICACION_CRON:0 * * * * *}
app.caja.cierre-automatico.zona=${APP_CAJA_ZONA:America/Argentina/Buenos_Aires}
