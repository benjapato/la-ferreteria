spring.application.name=LaFerreteriaReactBackend
# Configurar la conexion en cada equipo. No se incluyen credenciales ni una base por defecto.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

server.port=${SERVER_PORT:9092}
server.servlet.session.cookie.name=LAFERRETERIA_REACT_SESSION
server.servlet.session.cookie.same-site=lax

app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW:true}

# Usuario administrador que se crea solamente cuando no existe ningún administrador activo.
app.usuario-inicial.nombre=${APP_USUARIO_INICIAL_NOMBRE:Administrador}
app.usuario-inicial.usuario=${APP_USUARIO_INICIAL_USUARIO:admin}
app.usuario-inicial.contrasena=${APP_USUARIO_INICIAL_CONTRASENA:}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Copias de seguridad de PostgreSQL.
# La carpeta se crea automáticamente dentro del proyecto.
app.copias-seguridad.directorio=backups-react

# PostgreSQL 18 instalado en Windows.
app.copias-seguridad.pg-dump=${APP_COPIAS_SEGURIDAD_PG_DUMP:C:/Program Files/PostgreSQL/18/bin/pg_dump.exe}

# Copia automatica todos los dias a las 18:00, hora de Argentina.
app.copias-seguridad.automaticas.habilitadas=${APP_COPIAS_SEGURIDAD_AUTOMATICAS:true}
app.copias-seguridad.automaticas.cron=${APP_COPIAS_SEGURIDAD_CRON:0 0 18 * * *}
app.copias-seguridad.automaticas.zona=${APP_COPIAS_SEGURIDAD_ZONA:America/Argentina/Buenos_Aires}

# Cierre diario de caja. Se verifica cada minuto para recuperar el cierre si la
# computadora estuvo suspendida o el programa se inicio despues de las 23:00.
app.caja.cierre-automatico.habilitado=${APP_CAJA_CIERRE_AUTOMATICO:true}
app.caja.cierre-automatico.hora=${APP_CAJA_HORA_CIERRE:23:00}
app.caja.cierre-automatico.hora-aviso=${APP_CAJA_HORA_AVISO:22:45}
app.caja.cierre-automatico.verificacion-cron=${APP_CAJA_VERIFICACION_CRON:0 * * * * *}
app.caja.cierre-automatico.zona=${APP_CAJA_ZONA:America/Argentina/Buenos_Aires}
